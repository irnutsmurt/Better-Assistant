# Sentences the Better Assistant agent handles itself (matched with hassil before guards and search).
# {text} is free text; {person} and {zone} lists are filled at run time from your person and zone entities.
language: en
intents:
  WhoAmI:
    data:
      - sentences:
          - "who am i"
          - "who is (this|talking|speaking)"
          - "who's (this|talking|speaking)"
          - "do you know who (i am|this is|is talking)"
          - "(do|can) you (recognize|recognise|know) (me|my voice)"
          - "what's my name"
          - "what is my name"
  ReminderAdd:
    data:
      - sentences:
          - "remind me {text}"
          - "set [a|an] reminder {text}"
          - "(make|create|add) a reminder {text}"
  ReminderAddFor:
    data:
      - sentences:
          - "remind {person} {text}"
  UnknownPerson:
    data:
      - sentences:
          - "remind {name} (to|that|about) {text}"
          - "leave (a|an) (note|message) for {name} (that|saying) {text}"
  ReminderList:
    data:
      - sentences:
          - "(what are|list|read) [all] my reminders"
          - "(what|which) reminders do i have"
          - "do i have any reminders"
          - "what reminders are (there|set)"
  ReminderCancelAll:
    data:
      - sentences:
          - "(cancel|delete|clear|remove) (all [of] my|my|all [the]|all) reminders"
  ReminderCancel:
    data:
      - sentences:
          - "(cancel|delete|remove) (the|my) reminder (to|about|for) {text}"
  AlarmSet:
    data:
      - sentences:
          - "(set|create|make) (an|a|my|the) alarm (for|at|in) {text}"
          - "(set|create|make) (an|a|my|the) {text} alarm"
          - "(set|create|make) (an|a|my|the) alarm {text}"
          - "wake me [up] {text}"
  AlarmMove:
    data:
      - sentences:
          - "move [my|the] alarm to {text}"
          - "(ring|play|sound) [my|the] alarm {text}"
          - "(make|have) [my|the] alarm ring {text}"
          - "change [my|the] alarm to ring {text}"
  AlarmQuery:
    data:
      - sentences:
          - "(what time is|when is|what's|what is) my alarm [set for]"
          - "(is there|do i have|have i got) (an|any) alarm[s] [set]"
          - "is my alarm (set|on)"
  AlarmCancel:
    data:
      - sentences:
          - "(cancel|delete|remove|clear) [my|the|all] alarm[s]"
          - "(turn off|disable) my alarm"
  AlarmSnooze:
    data:
      - sentences:
          - "snooze [it|the alarm|my alarm|alarm]"
          - "snooze [it|the alarm|my alarm] for {any_minutes:minutes} [more] minute[s]"
          - "[just|give me|ok|okay] {snooze_minutes:minutes} more minute[s] [please]"
          - "(just|give me) {snooze_minutes:minutes} more minute[s] [please]"
  AlarmSnoozeSet:
    data:
      - sentences:
          - "(set|change|make) [the|my] snooze [time|length] (to|for) {any_minutes:minutes} minute[s]"
  AlarmSnoozeQuery:
    data:
      - sentences:
          - "how long is [the|my] snooze [time]"
          - "what('s| is) [the|my] snooze [time|length] [set to]"
  SnoozeLimitSet:
    data:
      - sentences:
          - "limit [the|my] snoozes to {limit_count:count} [snooze[s]|time[s]]"
          - "(set|change|make) [the|my] snooze limit (to|at) {limit_count:count} [snooze[s]|time[s]]"
          - "only (allow|let me have|give me) {limit_count:count} snooze[s]"
      - sentences:
          - "no snoozing"
          - "(turn off|disable) snoozing"
          - "(turn off|disable) [the] snooze"
          - "don't let me snooze"
        slots:
          count: 0
  SnoozeLimitClear:
    data:
      - sentences:
          - "no snooze limit"
          - "unlimited snoozes"
          - "(remove|clear|turn off) [the|my] snooze limit"
          - "(turn on|enable) snoozing"
          - "(turn on|enable) [the] snooze"
  SnoozeLimitQuery:
    data:
      - sentences:
          - "how many snoozes do i (get|have)"
          - "how many times can i snooze"
          - "what('s| is) [the|my] snooze limit"
  AlarmStop:
    data:
      - sentences:
          - "(stop|silence|dismiss|turn off) (the|my) alarm"
          - "alarm off"
          - "i'm up"
          - "i am up"
  NoteAdd:
    data:
      - sentences:
          - "(take|make|write) [a|an] note [that|saying] {text}"
          - "(note|remember) that {text}"
      - sentences:
          - "remember (where i put|i put) {text}"
        slots:
          put: "put"
      - sentences:
          - "remember (where i left|i left) {text}"
        slots:
          put: "left"
  NoteFind:
    data:
      - sentences:
          - "where did i (put|leave) {text}"
          - "where have i (put|left) {text}"
  NoteRead:
    data:
      - sentences:
          - "(read|what are|list) my notes"
          - "what's in my notes"
          - "what is in my notes"
          - "do i have any notes"
  NoteClear:
    data:
      - sentences:
          - "(clear|delete|erase|remove) [all] [of] my notes"
  MessageLeave:
    data:
      - sentences:
          - "leave (a|an) (note|message) for {person} [that|saying] {text}"
          - "leave {person} (a|an) (note|message) [that|saying] {text}"
          - "leave (a|an) (note|message) [that|saying] {text}"
  MessageRead:
    data:
      - sentences:
          - "(any|are there any|do i have any|have i got any) [new] messages"
          - "(read|play|what are) [my|the] messages"
          - "did anyone leave (me a|a) (message|note)"
  StopwatchStart:
    data:
      - sentences:
          - "(start|begin) [a|the] stopwatch"
  StopwatchStop:
    data:
      - sentences:
          - "(stop|end) [the] stopwatch"
  StopwatchRead:
    data:
      - sentences:
          - "(check|read) [the] stopwatch"
          - "how long (has|is) the stopwatch [been] [running|going|on]"
          - "what('s| is) [on] the stopwatch"
lists:
  text:
    wildcard: true
  name:
    wildcard: true
  # Explicit numbers only: an open wildcard here would steal "add 5 more minutes" from the timer intents.
  # "snooze for N minutes" / "set the snooze to N minutes": any number (capped at 30 when used).
  any_minutes:
    range: {from: 1, to: 999}
  limit_count:
    range: {from: 0, to: 99}
  snooze_minutes:
    values:
      - in: "1"
        out: 1
      - in: "2"
        out: 2
      - in: "3"
        out: 3
      - in: "4"
        out: 4
      - in: "5"
        out: 5
      - in: "6"
        out: 6
      - in: "7"
        out: 7
      - in: "8"
        out: 8
      - in: "9"
        out: 9
      - in: "10"
        out: 10
      - in: "11"
        out: 11
      - in: "12"
        out: 12
      - in: "15"
        out: 15
      - in: "20"
        out: 20
      - in: "25"
        out: 25
      - in: "30"
        out: 30
      - in: "one"
        out: 1
      - in: "two"
        out: 2
      - in: "three"
        out: 3
      - in: "four"
        out: 4
      - in: "five"
        out: 5
      - in: "six"
        out: 6
      - in: "seven"
        out: 7
      - in: "eight"
        out: 8
      - in: "nine"
        out: 9
      - in: "ten"
        out: 10
      - in: "eleven"
        out: 11
      - in: "twelve"
        out: 12
      - in: "fifteen"
        out: 15
      - in: "twenty"
        out: 20
      - in: "twenty five"
        out: 25
      - in: "twenty-five"
        out: 25
      - in: "thirty"
        out: 30
      - in: "a few"
        out: 3
      - in: "a couple"
        out: 2
      - in: "a couple of"
        out: 2
  person:
    values: []
