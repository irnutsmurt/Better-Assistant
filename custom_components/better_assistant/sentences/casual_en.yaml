# How people really say things: casual, terse and non-native English wordings, added to the intents in
# en.yaml and home_en.yaml (each block here is appended to that intent's own). Fillers and politeness
# ("hey", "um", "could you", "please") are stripped before matching (core/normalize.py), and "the",
# "a" and "my" are optional in every pattern, so neither needs writing out here.
# Checked against a corpus of everyday, terse, misheard and non-native requests (tests/test_casual.py, tests/data/phrasings.jsonl).
language: en
intents:
  # ------------------------------------------------------------------ who am I
  WhoAmI:
    data:
      - sentences:
          - "you know who i am"
          - "(do|can) you tell me who [you think] (i am|this is)"

  # ------------------------------------------------------------------ reminders
  ReminderAdd:
    data:
      - sentences:
          - "(you|please) remind me [to|for|about] {text}"
          - "remind me for {text}"
          - "me to {text}"
          - "(make|put|create) [a] reminder (to|for|about) {text}"
  ReminderAddFor:
    data:
      - sentences:
          - "(make|put|create) [a] reminder (to|for) {person} [to|for|about] {text}"
          - "(you|please) remind {person} [to|for|about] {text}"
  ReminderList:
    data:
      - sentences:
          - "reminders"
          - "my reminders [for {cal_range:range}]"
          - "(tell me|read me|give me|read) my reminders [for {cal_range:range}]"
          - "reminders (do|did) i have"
          - "(what|which) reminders i have"
          - "what did i ask you to remind me [about|of]"
          - "what (are|is) my reminder[s] [for {cal_range:range}]"
          - "(any|have i got any|is there any|are there any) reminders"
  ReminderCancelAll:
    data:
      - sentences:
          - "(cancel|delete|clear|remove|erase|get rid of) (every|all [of] [the]|all my|all [the]) reminder[s]"
          - "(clear|delete|remove|erase) [my|the] reminders"
          - "get rid of (every|all [of]) [my|the] reminder[s] [i've got|i have]"
          - "(cancel|delete|remove|clear) reminders all"
  ReminderCancel:
    data:
      - sentences:
          - "(cancel|delete|remove|forget|never mind) [the|my|that] reminder (of|about|to|for) {text}"
          - "(cancel|delete|remove) [the|my] {text} reminder"
          - "[the] reminder (about|for|to|of) {text} (cancel|delete|remove) [it]"

  # ------------------------------------------------------------------ alarms
  AlarmSet:
    data:
      - sentences:
          - "(put|make|set) [an|the|a|my] alarm (at|for|on) {text}"
          - "(you|please) (make|set|put) [an|the|a] alarm [at|for|on] {text}"
          - "alarm (at|for) {text}"
          - "an alarm (at|for) {text}"
          - "set me [an|a] alarm [at|for] {text}"
          - "i (want|need) [an|a] alarm [at|for] {text}"
  AlarmChange:
    data:
      - sentences:
          - "put [my|the] alarm {text}"
          - "alarm (earlier|later|sooner|back|up) {text}"
          - "alarm to {text}"
  AlarmMove:
    data:
      - sentences:
          - "alarm (ring|play) {text}"
          - "i want [the] alarm to (ring|play) {text}"
  AlarmMusic:
    data:
      - sentences:
          - "alarm music {text}"
          - "(change|set|put) [the] music (of|for|on) [my|the] alarm (to|for) {text}"
          - "i want [the|my] alarm with music (of|from|by) {text}"
          - "i want [the|my] alarm (to play|playing) {text}"
  AlarmQuery:
    data:
      - sentences:
          - "(when|what time)('s| is| will) [my|the] alarm [set for|going to go off|ring|going off|set]"
          - "(when|what time) (does|will|is) [my|the] alarm (ring|go off|going off)"
          - "what time alarm (will ring|is|ring)"
          - "(tell me|can you tell me) when [my|the] alarm('s| is) going off"
          - "what time did i set [my|the] alarm [for]"
          - "my alarm [is] what time"
          - "[is] [my|the] alarm (set|on)"
          - "alarm time"
  AlarmCancel:
    data:
      - sentences:
          - "(cancel|delete|remove|clear|turn off) [my|the] alarm (for|at) {text}"
          - "get rid of [my|the] alarm[s]"
          - "(cancel|delete|remove|clear) [the] alarm"
          - "turn off tomorrow's alarm [i don't need it]"
          - "i don't need [my|the|an] alarm [tomorrow|anymore]"
          - "no alarm [tomorrow]"
  AlarmSnooze:
    data:
      - sentences:
          - "snooze {any_minutes:minutes} minute[s]"
          - "let me sleep [more|longer] [for] {any_minutes:minutes} [more] minute[s]"
          - "let me sleep [a bit|a little] [more|longer]"
          - "(ugh|ah) snooze"
          - "{snooze_minutes:minutes} more minute[s]"
  AlarmSnoozeSet:
    data:
      - sentences:
          - "(make|change|set) [the|my] snooze [time|length|duration] [to|for] [be] {any_minutes:minutes} minute[s] [long] [from now on]"
          - "i want [the|my] snooze to be {any_minutes:minutes} minute[s] [long]"
          - "snooze [time|length|duration] {any_minutes:minutes} minute[s]"
  AlarmSnoozeQuery:
    data:
      - sentences:
          - "(how much time|how many minutes|how many minute) (is|does) [the] snooze [give me|last|be]"
          - "how many minute[s] [is] the snooze"
          - "snooze (length|time|duration)"
          - "how long (does|will) [the|a] snooze (last|go for|give me)"
  SnoozeLimitSet:
    data:
      - sentences:
          - "max[imum] {limit_count:count} snooze[s]"
          - "snooze only {limit_count:count} time[s] [maximum|max]"
          - "(make|put) [the] snooze limit (for|to|at) {limit_count:count}"
          - "only let me snooze {limit_count:count} time[s]"
      - sentences:
          - "only let me snooze (once|one time)"
        slots:
          count: 1
      - sentences:
          - "only let me snooze twice"
        slots:
          count: 2
      - sentences:
          - "don't let me snooze [at all] [tomorrow]"
          - "no snooze [at all|tomorrow]"
        slots:
          count: 0
  SnoozeLimitClear:
    data:
      - sentences:
          - "snooze unlimited"
          - "(delete|remove|clear) [the] limit (of|for|on) [the] snooze[s]"
          - "let me snooze as much as i want"
  SnoozeLimitQuery:
    data:
      - sentences:
          - "how (much|many) snoozes [do] i (have|get)"
          - "how many time[s] (can i|i can) snooze"
          - "snooze limit [is what]"
  AlarmStop:
    data:
      - sentences:
          - "(okay|ok) [okay|ok] stop"
          - "(turn off|stop) [the] alarm[,] (i'm|i am) (up|awake)"
          - "alarm off [i wake|i'm up|i'm awake]"
          - "(shut|turn) it off"
          - "close [the] alarm"
          - "(i'm|i am) awake"
          - "enough"

